function load(){try{let x=localStorage.getItem(KEY);return x?JSON.parse(x):structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function nextId(list){return Math.max(0,...list.map(x=>Number(x.id)||0))+1}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(name){return name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase()}function fmtDate(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}function fmtLong(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function member(id){return state.members.find(x=>x.id===Number(id))}function session(id){return state.sessions.find(x=>x.id===Number(id))}function reservationsFor(id){return state.reservations.filter(r=>r.sessionId===Number(id)&&r.status!=='Annulée')}function showToast(title,detail=''){let el=document.createElement('div');el.className='toast';el.innerHTML=`<b>${esc(title)}</b>${detail?`<small>${esc(detail)}</small>`:''}`;document.getElementById('toastArea').append(el);setTimeout(()=>el.remove(),3200)}function statusBadge(status){let c=status==='Actif'||status==='Confirmée'||status==='Présent'?'dark':status==='En attente'||status==='Liste d’attente'?'warn':'outline';return `<span class="badge ${c}">${esc(status)}</span>`}function pageTitle(p){return ({dashboard:"Vue d'ensemble",members:'Membres',sessions:'Séances',reservations:'Réservations',attendance:'Présences',history:'Historique',reports:'Rapports & statistiques',settings:'Paramètres'})[p]||p}

function reportsPage(){let active=state.members.filter(m=>m.status==='Actif').length;let confirm=state.reservations.filter(r=>r.status==='Confirmée').length;let attendance=Object.values(state.attendance).flat();let present=attendance.filter(x=>x==='Présent').length;let rate=attendance.length?Math.round(present/attendance.length*100):0;return `${head('PILOTAGE','Les chiffres racontent le club.','Un aperçu simple de l’activité et de la participation.',`<button class="btn" data-action="export">↧ Exporter le résumé</button>`)}<div class="report-grid">${[['Membres actifs',active,'sur '+state.members.length+' membres'],['Réservations confirmées',confirm,'toutes séances confondues'],['Taux de présence',rate+'%',attendance.length+' présences renseignées']].map(x=>`<div class="report-card"><div class="eyebrow">INDICATEUR CLÉ</div><h3>${x[0]}</h3><div class="report-number">${x[1]}</div><div class="report-foot">${x[2]}</div></div>`).join('')}</div><div class="bottom-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Participation par séance</div><div class="panel-sub">Réservations confirmées par activité</div></div></div><div class="chart-area"><div class="bars">${state.sessions.slice(0,7).map(s=>{let n=reservationsFor(s.id).length;return `<div class="bar-wrap"><div class="bar ${n>=s.capacity?'highlight':''}" style="height:${Math.max(5,n/Math.max(1,s.capacity)*100)}%" title="${n} réservations"></div><div class="bar-label">${esc(s.title.split(' ')[0])}</div></div>`}).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Santé des adhésions</div><div class="panel-sub">Statut actuel des membres</div></div></div><div class="chart-area"><div class="legend-list" style="padding:10px 0">${['Actif','En attente','Inactif'].map((x,i)=>`<div><div class="legend-row"><span class="legend-label">${x}</span><b>${state.members.filter(m=>m.status===x).length}</b></div><div class="progress"><span style="width:${state.members.length?state.members.filter(m=>m.status===x).length/state.members.length*100:0}%;background:${i===0?'#292926':i===1?'#9b9b94':'#d9d9d3'}"></span></div></div>`).join('')}</div></div></section></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">À propos des données</div><div class="panel-sub">Transparence pour la démonstration</div></div></div><div class="panel-body"><p style="font-size:12px;color:var(--muted);line-height:1.8;margin:0">Les chiffres sont calculés à partir des données présentes dans cette démonstration. La fréquentation hebdomadaire du tableau de bord contient des données illustratives. Aucune intégration de paiement, d’e-mail ou de SMS n’est activée.</p></div></div>`}
function historyPage(){let rows=state.reservations.filter(r=>!globalQuery||[member(r.memberId)?.name,session(r.sessionId)?.title,r.status].some(x=>String(x||'').toLowerCase().includes(globalQuery))).sort((a,b)=>(b.created||'').localeCompare(a.created||''));return `${head('ACTIVITÉ & SUIVI','Chaque parcours compte.','Consultez les réservations passées et les présences enregistrées.',`<button class="btn" data-action="export-attendance">↧ Exporter l’historique</button>`)}<div class="stats-grid">${stat('Participations enregistrées',Object.values(state.attendance).flat().filter(x=>x==='Présent').length,'Présences marquées comme présentes','✓')}${stat('Réservations totales',state.reservations.length,'Confirmées ou annulées','↺')}${stat('Membres suivis',new Set(rows.map(r=>r.memberId)).size,'Avec au moins une réservation','♙')}${stat('Séances suivies',new Set(rows.map(r=>r.sessionId)).size,'Avec au moins une réservation','◷')}</div><section class="panel"><div class="panel-head"><div><div class="panel-title">Historique de participation</div><div class="panel-sub">Chaque ligne relie un membre à une séance et à son statut.</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Membre</th><th>Séance</th><th>Date de séance</th><th>Réservation</th><th>Présence</th></tr></thead><tbody>${rows.map(r=>{let m=member(r.memberId),s=session(r.sessionId),att=(state.attendance[r.sessionId]||{})[r.memberId]||'À confirmer';return `<tr><td><div class="member-cell"><div class="mini-avatar">${initials(m?.name||'??')}</div><div><div class="cell-name">${esc(m?.name||'Membre')}</div><div class="cell-sub">${esc(m?.email||'')}</div></div></div></td><td>${esc(s?.title||'Séance supprimée')}</td><td>${fmtDate(s?.date)}</td><td>${statusBadge(r.status)}</td><td>${statusBadge(att)}</td></tr>`}).join('')||`<tr><td colspan="5"><div class="empty"><b>Aucun historique disponible</b>Les réservations et présences apparaîtront ici.</div></td></tr>`}</tbody></table></div></section><div class="panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Rappels de séance</div><div class="panel-sub">Aperçu des notifications à envoyer avant les cours</div></div><span class="badge outline">Simulation</span></div><div class="panel-body"><div class="activity-list">${state.sessions.filter(s=>s.status==='Planifiée').slice(0,3).map(s=>`<div class="activity"><div class="activity-dot">◷</div><div><strong>Rappel prévu · ${esc(s.title)}</strong><p>${fmtLong(s.date)} à ${esc(s.time)} · ${reservationsFor(s.id).length} inscrit(s)</p><time>Envoi simulé · aucun e-mail réel n’est envoyé</time></div></div>`).join('')}</div></div></div>`}
function viewRegistrants(sid){let s=session(sid);if(!s)return;let rs=reservationsFor(sid);openModal('Liste des inscrits',`<div class="panel-sub" style="margin-bottom:14px">${esc(s.title)} · ${fmtLong(s.date)} · ${rs.length}/${s.capacity} places réservées</div>${rs.map(r=>{let m=member(r.memberId);return `<div class="activity"><div class="mini-avatar">${initials(m?.name||'??')}</div><div style="flex:1"><strong>${esc(m?.name||'Membre')}</strong><p>${esc(m?.email||'')} · ${esc(m?.type||'')}</p></div>${statusBadge(r.status)}</div>`}).join('')||'<div class="empty"><b>Aucun inscrit</b>Cette séance n’a pas encore de réservation.</div>'}`,'Consultez les membres inscrits à cette séance.','<button class="btn" id="registrantsClose">Fermer</button>');document.getElementById('registrantsClose').onclick=closeModal}
function settingsPage(){return `${head('CONFIGURATION','Un espace à votre image.','Paramètres du club et gestion des données de démonstration.')}<div class="settings-grid"><section class="panel settings-nav"><button class="active">Profil du club</button><button data-action="export">Exporter les données</button><button data-action="reset-demo">Réinitialiser la démo</button></section><section class="panel settings-content"><h3>Informations du club</h3><p>Ces informations apparaissent dans votre espace de travail.</p><form id="settingsForm"><div class="field-grid"><div class="field full"><label for="settingName">Nom du club</label><input id="settingName" name="clubName" value="${esc(state.settings.clubName)}" required></div><div class="field full"><label for="settingAddress">Adresse</label><input id="settingAddress" name="address" value="${esc(state.settings.address)}"></div><div class="field"><label for="settingEmail">E-mail de contact</label><input id="settingEmail" name="email" type="email" value="${esc(state.settings.email)}"></div><div class="field"><label for="settingCapacity">Capacité par défaut</label><input id="settingCapacity" name="capacity" type="number" min="1" value="${state.settings.capacity}"></div></div><div class="settings-footer"><button class="btn primary" type="submit">Enregistrer les paramètres</button></div></form><div style="border-top:1px solid var(--line);margin-top:26px;padding-top:20px"><h3>Environnement de démonstration</h3><p>Les données sont sauvegardées localement dans ce navigateur via localStorage. Aucun compte réel ou service externe n’est connecté.</p><button class="btn" data-action="reset-demo">Réinitialiser toutes les données</button></div></section></div>`}
function wirePage(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navTo(b.dataset.nav));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action,b.dataset.id,b.dataset));let mf=document.getElementById('memberFilter');if(mf)mf.onchange=()=>{memberFilter=mf.value;render()};let sf=document.getElementById('sessionFilter');if(sf)sf.onchange=()=>{sessionFilter=sf.value;render()};let rf=document.getElementById('reservationFilter');if(rf)rf.onchange=()=>{reservationFilter=rf.value;render()};let as=document.getElementById('attendanceSession');if(as)as.onchange=()=>{attendanceSession=Number(as.value);render()};let form=document.getElementById('settingsForm');if(form)form.onsubmit=e=>{e.preventDefault();let f=new FormData(form);state.settings={clubName:f.get('clubName'),address:f.get('address'),email:f.get('email'),capacity:Number(f.get('capacity'))||18};save();showToast('Paramètres enregistrés','Les informations du club ont été mises à jour.')};}
function handleAction(a,id,data={}){switch(a){case'new-member':openMemberForm();break;case'edit-member':openMemberForm(member(id));break;case'view-member':viewMember(member(id));break;case'view-registrants':viewRegistrants(Number(id));break;case'new-session':openSessionForm();break;case'edit-session':openSessionForm(session(id));break;case'reserve-session':openReservationForm(Number(id));break;case'new-reservation':openReservationForm();break;case'cancel-reservation':cancelReservation(Number(id));break;case'attendance-status':setAttendance(Number(data.session),Number(id),data.status);break;case'save-attendance':showToast('Feuille de présence terminée','Les présences sont sauvegardées.');state.activity.unshift({title:'Présences mises à jour',detail:session(id)?.title||'Séance',time:'À l’instant'});save();break;case'export':exportData();break;case'export-members':exportCSV(state.members,'sportflow-membres.csv');break;case'export-sessions':exportCSV(state.sessions,'sportflow-seances.csv');break;case'export-attendance':exportCSV(Object.entries(state.attendance).flatMap(([sid,vals])=>Object.entries(vals).map(([mid,status])=>({seance:session(sid)?.title,membre:member(mid)?.name,statut:status}))), 'sportflow-presences.csv');break;case'reset-search':globalQuery='';document.getElementById('globalSearch').value='';memberFilter='Tous';render();break;case'reset-demo':confirmReset();break;case'quick-add':openQuickAdd();break;}}
function openQuickAdd(){openModal('Ajouter rapidement',`<div style="display:grid;gap:10px"><button class="btn" data-modal-action="member">♙ Ajouter un membre</button><button class="btn" data-modal-action="session">◷ Créer une séance</button><button class="btn" data-modal-action="reservation">▣ Créer une réservation</button></div>`,'Choisissez ce que vous souhaitez ajouter.');document.querySelectorAll('[data-modal-action]').forEach(b=>b.onclick=()=>{closeModal();if(b.dataset.modalAction==='member')openMemberForm();if(b.dataset.modalAction==='session')openSessionForm();if(b.dataset.modalAction==='reservation')openReservationForm()})}
function openModal(title,body,subtitle='',foot=''){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="close" id="modalClose" aria-label="Fermer">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',escModal,{once:true})}function escModal(e){if(e.key==='Escape')closeModal()}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openMemberForm(m=null){let edit=!!m;openModal(edit?'Modifier le membre':'Ajouter un membre',`<form id="memberForm"><div class="form-grid"><div class="field full"><label>Nom complet *</label><input name="name" required value="${esc(m?.name||'')}" placeholder="Ex. Sara El Amrani"></div><div class="field"><label>E-mail *</label><input type="email" name="email" required value="${esc(m?.email||'')}" placeholder="nom@exemple.com"></div><div class="field"><label>Téléphone</label><input name="phone" value="${esc(m?.phone||'')}" placeholder="06 …"></div><div class="field"><label>Formule</label><select name="type">${['Premium','Standard','Étudiant'].map(x=>`<option ${m?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Statut</label><select name="status">${['Actif','En attente','Inactif'].map(x=>`<option ${m?.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="modal-foot" style="padding:20px 0 0"><button type="button" class="btn" id="cancelMember">Annuler</button><button class="btn primary" type="submit">${edit?'Enregistrer':'Créer le membre'}</button></div></form>`,edit?'Mettez à jour les informations du profil.':'Ajoutez un nouveau profil à votre communauté.');document.getElementById('cancelMember').onclick=closeModal;document.getElementById('memberForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase();if(state.members.some(x=>x.email.toLowerCase()===email&&x.id!==m?.id)){showToast('Adresse e-mail déjà utilisée','Chaque membre doit avoir une adresse unique.');return}let obj={id:m?.id||nextId(state.members),name:String(f.get('name')).trim(),email,phone:String(f.get('phone')).trim(),type:f.get('type'),status:f.get('status'),joined:m?.joined||new Date().toISOString().slice(0,10),sessions:m?.sessions||0};if(edit)state.members=state.members.map(x=>x.id===m.id?obj:x);else{state.members.unshift(obj);state.activity.unshift({title:'Nouveau membre ajouté',detail:obj.name+' a rejoint le club',time:'À l’instant'})}closeModal();save();showToast(edit?'Profil mis à jour':'Membre ajouté',obj.name)}}
function viewMember(m){if(!m)return;openModal('Profil membre',`<div class="member-cell" style="margin-bottom:20px"><div class="mini-avatar" style="width:48px;height:48px;font-size:14px">${initials(m.name)}</div><div><div class="cell-name" style="font-size:16px">${esc(m.name)}</div><div class="cell-sub">Membre depuis ${fmtLong(m.joined)}</div></div></div><div class="summary-line"><span>E-mail</span><b>${esc(m.email)}</b></div><div class="summary-line"><span>Téléphone</span><b>${esc(m.phone||'—')}</b></div><div class="summary-line"><span>Formule</span><b>${esc(m.type)}</b></div><div class="summary-line"><span>Statut</span>${statusBadge(m.status)}</div><div class="summary-line"><span>Séances suivies</span><b>${m.sessions}</b></div><div class="summary-line"><span>Réservations actives</span><b>${state.reservations.filter(r=>r.memberId===m.id&&r.status==='Confirmée').length}</b></div>`,'Informations du profil et activité.','<button class="btn" id="profileClose">Fermer</button>');document.getElementById('profileClose').onclick=closeModal}
function openSessionForm(s=null){let edit=!!s;openModal(edit?'Modifier la séance':'Créer une séance',`<form id="sessionForm"><div class="form-grid"><div class="field full"><label>Nom de la séance *</label><input name="title" required value="${esc(s?.title||'')}" placeholder="Ex. HIIT & Cardio"></div><div class="field"><label>Catégorie</label><select name="category">${['Fitness','Bien-être','Musculation','Combat','Autre'].map(x=>`<option ${s?.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Coach</label><input name="coach" required value="${esc(s?.coach||'')}" placeholder="Nom du coach"></div><div class="field"><label>Date *</label><input type="date" name="date" required value="${esc(s?.date||'2026-10-18')}"></div><div class="field"><label>Heure *</label><input type="time" name="time" required value="${esc(s?.time||'18:00')}"></div><div class="field"><label>Durée (min)</label><input type="number" name="duration" min="15" max="240" value="${s?.duration||45}"></div><div class="field"><label>Capacité *</label><input type="number" name="capacity" min="1" max="100" required value="${s?.capacity||state.settings.capacity}"></div><div class="field full"><label>Salle</label><input name="room" value="${esc(s?.room||'Studio A')}"></div></div><div class="modal-foot" style="padding:20px 0 0"><button type="button" class="btn" id="cancelSession">Annuler</button><button type="submit" class="btn primary">${edit?'Enregistrer':'Créer la séance'}</button></div></form>`,edit?'Modifiez les détails de cette séance.':'Ajoutez un cours au planning du club.');document.getElementById('cancelSession').onclick=closeModal;document.getElementById('sessionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:s?.id||nextId(state.sessions),title:String(f.get('title')).trim(),category:f.get('category'),coach:String(f.get('coach')).trim(),date:f.get('date'),time:f.get('time'),duration:Number(f.get('duration'))||45,capacity:Number(f.get('capacity'))||state.settings.capacity,room:String(f.get('room')).trim()||'Studio A',status:'Planifiée',icon:s?.icon||'◷'};let booked=reservationsFor(obj.id).length;if(obj.capacity<booked){showToast('Capacité insuffisante',`Il y a déjà ${booked} réservation(s) pour cette séance.`);return}let conflict=state.sessions.some(x=>x.id!==obj.id&&x.coach.toLowerCase()===obj.coach.toLowerCase()&&x.date===obj.date&&x.time===obj.time);if(conflict){showToast('Conflit de planning','Ce coach a déjà une séance à cette date et à cette heure.');return}if(edit)state.sessions=state.sessions.map(x=>x.id===s.id?obj:x);else{state.sessions.push(obj);state.activity.unshift({title:'Séance planifiée',detail:obj.title+' · '+obj.room,time:'À l’instant'})}closeModal();save();showToast(edit?'Séance mise à jour':'Séance créée',obj.title)}}
function openReservationForm(preselect=null){let available=state.sessions.filter(s=>s.status!=='Annulée'&&reservationsFor(s.id).length<s.capacity);if(!available.length){showToast('Aucune place disponible','Créez une séance ou vérifiez les capacités.');return}let eligible=state.members.filter(m=>m.status==='Actif');openModal('Nouvelle réservation',`<form id="reservationForm"><div class="form-grid"><div class="field full"><label>Membre *</label><select name="memberId" required>${eligible.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.type)}</option>`).join('')}</select></div><div class="field full"><label>Séance *</label><select name="sessionId" required>${available.map(s=>`<option value="${s.id}" ${s.id===preselect?'selected':''}>${esc(s.title)} · ${fmtDate(s.date)} ${esc(s.time)} · ${s.capacity-reservationsFor(s.id).length} places</option>`).join('')}</select></div></div><p class="panel-sub" style="line-height:1.6;margin-top:16px">SportFlow vérifie automatiquement les doublons et les places disponibles avant de confirmer.</p><div class="modal-foot" style="padding:20px 0 0"><button type="button" class="btn" id="cancelReservation">Annuler</button><button type="submit" class="btn primary">Confirmer la réservation</button></div></form>`,'Réservez une place pour un membre du club.');document.getElementById('cancelReservation').onclick=closeModal;document.getElementById('reservationForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),mid=Number(f.get('memberId')),sid=Number(f.get('sessionId')),s=session(sid);if(state.reservations.some(r=>r.memberId===mid&&r.sessionId===sid&&r.status!=='Annulée')){showToast('Réservation en double','Ce membre a déjà une réservation active pour cette séance.');return}if(reservationsFor(sid).length>=s.capacity){showToast('Séance complète','La capacité maximale est atteinte.');return}let r={id:nextId(state.reservations),memberId:mid,sessionId:sid,status:'Confirmée',created:new Date().toISOString().slice(0,10)};state.reservations.unshift(r);state.activity.unshift({title:'Nouvelle réservation confirmée',detail:member(mid)?.name+' · '+s.title,time:'À l’instant'});closeModal();save();showToast('Réservation confirmée',member(mid)?.name+' · '+s.title)}}
function cancelReservation(id){let r=state.reservations.find(x=>x.id===id);if(!r||r.status==='Annulée')return;if(!confirm(`Annuler la réservation de ${member(r.memberId)?.name||'ce membre'} pour ${session(r.sessionId)?.title||'cette séance'} ?`))return;r.status='Annulée';save();showToast('Réservation annulée','La place est de nouveau disponible.')}
function setAttendance(sid,mid,status){if(!state.attendance[sid])state.attendance[sid]={};state.attendance[sid][mid]=status;save();showToast('Présence mise à jour',member(mid)?.name+' · '+status)}
function confirmReset(){openModal('Réinitialiser la démonstration ?',`<p style="font-size:12px;line-height:1.7;color:var(--muted)">Toutes les modifications locales (membres, séances, réservations et présences) seront remplacées par les données initiales de démonstration. Cette action ne touche à aucun Jira.</p>`,'Cette action est irréversible pour les données locales.','<button class="btn" id="noReset">Annuler</button><button class="btn primary" id="yesReset">Réinitialiser</button>');document.getElementById('noReset').onclick=closeModal;document.getElementById('yesReset').onclick=()=>{state=structuredClone(seed);save();closeModal();showToast('Démo réinitialisée','Les données initiales sont restaurées.')}}
function exportCSV(rows,filename){if(!rows.length){showToast('Aucune donnée à exporter');return}let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');downloadFile('\ufeff'+csv,filename,'text/csv;charset=utf-8;');showToast('Export prêt',filename)}function exportData(){downloadFile(JSON.stringify(state,null,2),'sportflow-demo-data.json','application/json');showToast('Sauvegarde exportée','Le fichier JSON contient les données locales.')}function downloadFile(text,filename,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
render();
</script></body></html>
